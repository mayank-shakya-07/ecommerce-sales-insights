version: '3.8'

services:
  # PostgreSQL Database for Data Warehousing Simulation
  data-warehouse:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: data_analyst
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ecommerce_analysis.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # PgAdmin for Database Management UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - data-warehouse
    restart: unless-stopped

  # Jupyter Notebook for Python Analysis
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: ecommerce_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "easy_password"
    depends_on:
      - data-warehouse

volumes:
  pgdata:
